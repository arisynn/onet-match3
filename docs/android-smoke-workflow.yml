name: Android startup and rendering smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify JavaScript logic and asset integrity
        run: npm test && npm run check:assets
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android rendering and navigation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :core:test :headless:test :android:connectedDebugAndroidTest --console=plain
            mkdir -p smoke-screenshots
            adb pull /sdcard/Android/data/com.onetmatch3.game/files/smoke/. smoke-screenshots/
      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-smoke-evidence
          path: |
            smoke-screenshots/
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
            core/build/reports/tests/test/
            headless/build/reports/tests/test/
          retention-days: 14
