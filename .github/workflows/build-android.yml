name: Build & Sign Android Release (APK & AAB)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign:
    name: Build, Test & Sign Android Release
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Decode Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> $GITHUB_ENV
          echo "Keystore successfully decoded to workspace."

      - name: Run Kotlin Unit & Logic Tests
        run: ./gradlew test --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Build Signed Release Android App Bundle (AAB)
        run: ./gradlew :android:bundleRelease --stacktrace

      - name: Verify Release APK Signature & Certificate
        run: |
          APK_PATH=$(find android/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found!"
            exit 1
          fi
          echo "Release APK located at: $APK_PATH"
          ls -lh "$APK_PATH"
          
          # Find apksigner in Android build-tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Verify Release AAB Bundle
        run: |
          AAB_PATH=$(find android/build/outputs/bundle/release -name "*.aab" -type f | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "::error::Release AAB not found!"
            exit 1
          fi
          echo "Release AAB located at: $AAB_PATH"
          ls -lh "$AAB_PATH"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onet-match3-release-apk
          path: android/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onet-match3-release-aab
          path: android/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/test/
            headless/build/reports/tests/test/
          retention-days: 14

      - name: Secure Cleanup of Keystore
        if: always()
        run: |
          rm -rf keystore/
          echo "Sensitive keystore files removed from runner."
